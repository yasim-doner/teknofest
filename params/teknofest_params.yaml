# ROS 2 parameter file for the Teknofest package nodes

fallow_corridor:
  ros__parameters:
    target_speed: 0.2
    min_speed: 0.05
    max_angular_speed: 0.4
    kp_center: 0.8
    kp_avoid: 1.0
    pitch_scale_factor: 1.5
    min_speed_factor: 0.5
    max_speed_factor: 2.0
    lookahead_min_x: 0.3
    lookahead_max_x: 3.5
    lookahead_y: 2.2
    crop_min_z: -0.65
    crop_max_z: 0.65
    grid_cell_size: 0.2
    min_height_diff: 0.18
    front_obstacle_dist: 1.8
    front_stop_dist: 0.65
    min_points_threshold: 15

cone_avoid:
  ros__parameters:
    initial_stage: 5
    target_speed: 0.18
    slow_speed: 0.07
    kp_lateral: 1.30
    kp_heading: 0.55
    max_angular_speed: 0.50
    hard_turn_speed: 0.50
    smoothing_alpha: 0.45
    lookahead_min_x: 0.15
    lookahead_max_x: 3.00
    crop_half_width: 1.80
    crop_min_z: -0.65
    crop_max_z: 0.75
    ground_grid_size: 0.20
    min_height_diff: 0.10
    cluster_cell_size: 0.18
    cone_min_points: 5
    cone_max_width: 0.95
    cone_max_depth: 0.95
    cone_detect_distance: 2.50
    cone_search_half_width: 1.40
    pair_max_x_gap: 1.25
    safe_lateral_clearance: 0.80
    collision_half_width: 0.62
    max_target_offset: 0.65
    danger_distance: 1.00
    default_avoid_side: -1
    emergency_distance: 0.65
    emergency_half_width: 0.62
    emergency_min_points: 3

dynamic_obstacle:
  ros__parameters:
    initial_stage: 0
    target_speed: 0.45
    detection_min_x: 0.4
    detection_max_x: 2.2
    detection_y: 0.8
    vehicle_half_width: 0.38
    crop_min_z: -0.65
    crop_max_z: 0.65
    grid_cell_size: 0.2
    min_height_diff: 0.18
    min_points_threshold: 15
    crossing_duration: 3.0
    kp_steering: 0.6
    max_angular_speed: 0.3

sign_detect:
  ros__parameters:
    image_topic: "/rover/camera/image_raw"
    textures_dir: "/home/myazou/rover_ws/src/teknofest/textures"
    use_template_matching: true
    template_match_threshold: 0.65
    show_unmatched_candidates: false
    real_sign_diameter: 0.60
    enable_physical_size_filter: true
    min_sign_diameter: 0.35
    max_sign_diameter: 0.85
    min_component_area: 30
    max_component_area_ratio: 0.15
    min_candidate_size: 8
    max_candidate_size: 220
    min_aspect: 0.45
    max_aspect: 1.75
    min_white_ratio: 0.08
    min_red_fill_ratio: 0.02
    enter_radius: 14
    exit_radius: 9
    enter_frames: 2
    exit_frames: 3
    max_stage_candidate_y_ratio: 0.78
    upper_enter_radius: 10
    stop_guard_seconds: 3.0
    diagnostic_every_frames: 5
    min_stage_travel_distance: 1.5
    min_stage_interval_seconds: 2.0
    use_stage_geofence: true
    stage_geofence_radius: 3.0
    use_odom_fallback: true
    odom_fallback_radius: 2.5
    final_stage: 10
    stop_after_final_stage: true

ramp:
  ros__parameters:
    active_stage: 8
    drive_speed: 0.35
    ramp_pitch_threshold_deg: 8.0
    flat_pitch_threshold_deg: 3.0
    flat_drive_duration: 1.0
    stop_duration: 2.0
    laser_duration: 1.2

target_detect:
  ros__parameters:
    image_topic: "/rover/camera/image_raw"
    # ZED 2i Kamera Odak Değerleri (Focal Length - fx, fy):
    # HD1080 Mode (1920x1080): fx = 525.0, fy = 525.0  (HFOV ~110°)
    # HD720 Mode  (1280x720) : fx = 350.0, fy = 350.0  (HFOV ~110°)
    # 2.2K Mode   (2208x1242): fx = 1050.0, fy = 1050.0
    # Gazebo Sim  (640x480)  : fx = 320.0, fy = 320.0  (HFOV = 90°)
    fx: 525.0
    fy: 525.0
    active_stage: 8



